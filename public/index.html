<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>admitere360</title>
<style>
/* culorile si stilul din prototip */
:root{--bg:#fff;--fg:#111;--mut:#666;--ac:#ff5a4f;--acbg:#fff0ee;--bd:#e6e6e6;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#f3f3f3;--mut:#a0a0a0;--acbg:#3a1f1c;--bd:#333;--card:#1c1c1c}}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.demo{background:var(--acbg);font-size:13px;text-align:center;padding:6px 10px;border-bottom:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;max-width:440px;margin:32px auto}
@media(max-width:480px){.card{margin:16px;padding:16px}}
.logo{font-weight:800;font-size:24px;letter-spacing:-.5px;margin-bottom:8px}.logo b{color:var(--ac)}
.mut{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<div class="demo">Versiune demonstrativă. Folosește doar date fictive.</div>
<div class="card">
  <div class="logo">admitere<b>360</b></div>
  <h3>Platforma de admitere — în dezvoltare</h3>
  <p class="mut">Aici vor apărea crearea contului, autentificarea și profilul candidatului.</p>
</div>
</body>
</html>
